{% extends "base.html" %}

{% block title %}
Start Interview - InterviewAI
{% endblock %}

{% block content %}

<main class="setup-page">

    <div class="setup-header">

        <div class="badge">
            INTERVIEW SETUP
        </div>

        <h1>
            Configure Your Interview
        </h1>

        <p>
            Choose your role, difficulty and interview type.
        </p>

    </div>


    <form action="/start-interview"
          method="POST"
          class="setup-card">


        <div class="form-group">

            <label>
                Target Role
            </label>

            <select name="role"
                    required>

                {% for role in roles %}

                <option value="{{ role }}">
                    {{ role }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>
                Difficulty Level
            </label>

            <select name="difficulty"
                    required>

                <option value="Easy">
                    Easy
                </option>

                <option value="Medium">
                    Medium
                </option>

                <option value="Hard">
                    Hard
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Interview Type
            </label>

            <div class="radio-grid">

                <label class="radio-card">

                    <input
                        type="radio"
                        name="interview_type"
                        value="Technical"
                        checked
                    >

                    <span>
                        💻
                        <strong>Technical</strong>
                        <small>
                            Technical questions
                        </small>
                    </span>

                </label>


                <label class="radio-card">

                    <input
                        type="radio"
                        name="interview_type"
                        value="HR"
                    >

                    <span>
                        👤
                        <strong>HR</strong>
                        <small>
                            Behavioral questions
                        </small>
                    </span>

                </label>


                <label class="radio-card">

                    <input
                        type="radio"
                        name="interview_type"
                        value="Mixed"
                    >

                    <span>
                        🧠
                        <strong>Mixed</strong>
                        <small>
                            Technical + HR
                        </small>
                    </span>

                </label>

            </div>

        </div>


        <button class="full-button"
                type="submit">

            Start Interview →

        </button>

    </form>

</main>

{% endblock %}
